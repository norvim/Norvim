<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norvim Account & Wallet</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/marketplace.css"></head>
<body class="market-page"><main class="market-wrap"><div class="market-nav"><a class="market-btn secondary" href="marketplace.html">Marketplace</a><a class="market-btn secondary" href="applicant-dashboard.html">Jobs Dashboard</a><a class="market-btn secondary" href="worker-dashboard.html">Worker Dashboard</a><a class="market-btn secondary" href="advertise.html">Advertise</a><button class="market-btn secondary" id="logout">Logout</button></div>
<section class="market-card account-hero-card"><div><span class="market-kicker">NORVIM ACCOUNT</span><h1>Account &amp; Wallet</h1><p id="accountUser">Loading…</p></div><div class="account-balance"><span>Balance</span><strong id="balance">KSh 0</strong><small id="walletStatus">Available</small></div></section>
<section class="wallet-tools market-card"><div class="wallet-tool"><h2>Top Up</h2><form id="walletTopupForm" class="wallet-topup-form"><div class="wallet-topup-row"><input id="walletTopupAmount" type="number" min="10" max="100000" step="1" placeholder="Amount in KSh" required><input id="walletTopupPhone" type="tel" placeholder="M-PESA number (optional)"><button id="walletTopupBtn" class="market-btn market-primary" type="submit">Add Money</button></div></form></div>
<div class="wallet-tool withdraw-tool"><h2>Withdraw Funds</h2><form id="walletWithdrawForm" class="wallet-topup-form"><div class="wallet-topup-row"><input id="walletWithdrawAmount" type="number" min="10" max="100000" step="1" placeholder="Amount in KSh" required><input id="walletWithdrawPhone" type="tel" placeholder="Withdrawal number (optional)"><button id="walletWithdrawBtn" class="market-btn market-outline" type="submit">Withdraw Funds</button></div></form></div></section>
<section class="market-card"><h2>Transactions</h2><div id="transactions"></div></section></main><script src="js/account.js?v=20260908-2"></script><script src="js/photo-viewer.js?v=20260914-taper"></script>
<script src="js/location-sync.js?v=20260914-taper"></script>
</body></html>
