<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job</title>
    <link rel="stylesheet" href="css/style.css">
        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#123b66">
</head>

<body>

    <h1>Edit Job</h1>

    <form id="editJobForm">

        <label>Job Title</label>
        <input id="title" type="text">

        <label>Company</label>
        <input id="company" type="text">

        <label>Location</label>
        <input id="location" type="text">

        <label>Salary</label>
        <input id="salary" type="text">

        <label>Description</label>
        <textarea id="description"></textarea>

        <button type="submit" id="editJobBtn">Save Changes</button>

    </form>


    <script src="js/edit-job.js?v=20260901-4"></script>
    <script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope: '/'})
    .catch(error => console.warn('Norvim app setup unavailable:', error)));
}
</script>
</body>
</html>
