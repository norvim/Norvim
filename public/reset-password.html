<!DOCTYPE html>
<html>

<head>

    <title>Reset Password</title>

    <link rel="stylesheet" href="css/style.css">

        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#123b66">
</head>

<body>

<h2>Reset Password</h2>

<form id="resetForm">

    <input
        type="password"
        id="password"
        placeholder="Enter new password"
        required
    >

    <br><br>

    <button type="submit">
        Reset Password
    </button>

</form>

<script src="js/reset-password.js?v=20260901-4"></script>
<script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope: '/'})
    .catch(error => console.warn('Norvim app setup unavailable:', error)));
}
</script>
</body>

</html>
