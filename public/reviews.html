<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews & Ratings | Norvim</title><link rel="stylesheet" href="/css/style.css"><style>body{background:#f3f6fb}.review-wrap{max-width:760px;margin:30px auto;padding:16px}.review-card{background:white;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 30px #12274712}.review-hero{background:linear-gradient(120deg,#102444,#087f8c);color:white;border-radius:16px;padding:22px;margin-bottom:18px}.review-card label{display:block;font-weight:700;margin:15px 0 7px}.review-card input,.review-card select,.review-card textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.review-card textarea{min-height:120px}.review-card button{margin-top:18px;border:0;border-radius:10px;background:#087f8c;color:white;font-weight:800;padding:13px 20px}.review-status{margin-top:14px}.review-link{color:#087f8c}</style></head><body><main class="review-wrap"><header class="review-hero"><h1>Reviews &amp; ratings</h1><p>Share honest feedback after a Norvim marketplace job has been completed.</p><a href="/marketplace.html" style="color:#a4f8e9">← Back to marketplace</a></header><section class="review-card"><form id="reviewForm"><label for="bookingId">Choose completed job</label><select id="bookingId" required><option value="">Loading your completed jobs…</option></select><p id="reviewJobDetails" class="review-status" aria-live="polite">Choose a completed job to review the other participant by registered name.</p><label for="rating">Rating</label><select id="rating" required><option value="5">★★★★★ — Excellent (5)</option><option value="4">★★★★☆ — Good (4)</option><option value="3">★★★☆☆ — Okay (3)</option><option value="2">★★☆☆☆ — Poor (2)</option><option value="1">★☆☆☆☆ — Very poor (1)</option></select><label for="comment">Comment (optional)</label><textarea id="comment" maxlength="1000" placeholder="Describe your experience respectfully…"></textarea><button type="submit">Submit review</button><p id="reviewStatus" class="review-status" role="status"></p></form></section></main><script src="/js/reviews.js?v=norvim-sports-1"></script></body></html>
