<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Profile | Norvim</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/marketplace.css"></head><body class="market-page"><main class="market-wrap"><div class="market-nav"><a class="market-btn market-light" href="marketplace.html">← Marketplace</a><a class="market-btn market-light" href="worker-dashboard.html">Worker Dashboard</a></div><section class="market-card"><h1>My Worker Profile</h1><p class="market-muted">Offer multiple services from one profile. Your location is used for nearby matching.</p><form id="form" class="market-form"><label>Display name<input id="displayName" maxlength="100"></label><label>Bio<textarea id="bio" maxlength="1000" placeholder="Tell customers what you do well."></textarea></label><label>Services<select id="services" multiple required size="7"></select></label><label>Skills<input id="skills" placeholder="e.g. wiring, solar, troubleshooting"></label><label>Experience<textarea id="experience" maxlength="2000"></textarea></label><label>County<input id="county" placeholder="e.g. Nairobi"></label><label>Area<input id="area" placeholder="e.g. Umoja 3"></label><div class="market-actions"><button class="market-btn market-primary" type="button" id="useLocation">⌖ Use my location</button><span id="locationStatus" class="market-muted">Recommended. Norvim captures your GPS location automatically for distance matching.</span></div><label>Availability<select id="status"><option>Available</option><option>Busy</option><option>Offline</option></select></label><label>Service radius (km)<input id="radius" type="number" min="1" max="500" value="10"></label><label>Pricing preference<select id="priceType"><option value="negotiable">Negotiable</option><option value="hourly">Hourly</option><option value="fixed">Fixed price</option></select></label><label>Amount (KES) <span class="market-muted">optional</span><input id="amount" type="number" min="0" placeholder="Optional starting/quoted amount"></label><button class="market-btn market-primary" type="submit">Save Worker Profile</button></form><div id="message"></div></section></main><script src="js/worker-profile-setup.js"></script></body></html>
