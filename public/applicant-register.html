<!DOCTYPE html>
<html>
<head>
    <title>Applicant Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page applicant-auth-page">

<main class="auth-shell"><section class="auth-card graffiti-applicant">
<div class="auth-graffiti" aria-hidden="true"><span>NORVIM</span><span>CREATE</span><span>RISE</span></div>
<div class="auth-brand"><img src="images/logo.png" alt="Norvim Logo" class="auth-logo"><span>APPLICANT SPACE</span></div>
<h1>Create your Applicant Account</h1>
<p class="auth-intro">Build your profile and open the door to jobs and opportunities on Norvim.</p>

<form id="registerForm">

    <input type="text" id="name" placeholder="Full Name" required><br><br>

    <input type="email" id="email" placeholder="Email" required><br><br>

    <input type="text" id="phone" placeholder="Phone Number" required><br><br>

    <div class="password-container">

    <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
    >

    <button type="button" onclick="togglePassword()">
        👁️
    </button>

</div>

    <button type="submit" id="registerBtn">Register</button>
    <button type="button" class="back-btn" onclick="window.location.href='index.html'">
    ← Back to Home
</button>

</form>
<div class="auth-bottom-note">Already have an account? <a href="applicant-login.html">Log in</a></div>
</section></main>

<script src="js/applicant-register.js?v=20260901-4"></script>
<script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>
</body>
</html>
