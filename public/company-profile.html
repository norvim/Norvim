<!DOCTYPE html>
<html>

<head>

    <title>Company Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<h2>Company Profile</h2>

<form id="companyProfileForm">

    <textarea
        id="companyDescription"
        placeholder="About your company"
    ></textarea>

    <br><br>

    <input
        type="text"
        id="industry"
        placeholder="Industry"
    >

    <br><br>

    <input
        type="text"
        id="website"
        placeholder="Website"
    >

    <br><br>

    <input
    type="text"
    id="location"
    placeholder="Company Location"
>

<br><br>

    <input
        type="text"
        id="companySize"
        placeholder="Company Size"
    >

    <br><br>

    <input
        type="number"
        id="foundedYear"
        placeholder="Founded Year"
    >

    <br><br>

    <button type="submit">

        Save Profile

    </button>
<a href="employer-dashboard.html">⬅️ Back</a>
<br><br>


</form>

<script src="js/company-profile.js"></script>

</body>

</html>
