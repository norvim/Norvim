<!DOCTYPE html>
<html>

<head>

    <title>Company Profile</title>

    <link rel="stylesheet" href="css/style.css">

        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#123b66">
</head>

<body>

<h2>Company Profile</h2>

<form id="companyProfileForm">

    <textarea
        id="companyDescription"
        placeholder="About your company"
    ></textarea>

    <br><br>

    <input
        type="text"
        id="industry"
        placeholder="Industry"
    >

    <br><br>

    <input
        type="text"
        id="website"
        placeholder="Website"
    >

    <br><br>

    <input
    type="text"
    id="location"
    placeholder="Company Location"
>

<br><br>

    <input
        type="text"
        id="companySize"
        placeholder="Company Size"
    >

    <br><br>

    <input
        type="number"
        id="foundedYear"
        placeholder="Founded Year"
    >

    <br><br>

    <button type="submit">

        Save Profile

    </button>
<a href="employer-dashboard.html">⬅️ Back</a>
<br><br>


</form>

<script src="js/company-profile.js?v=20260901-4"></script>
<script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope: '/'})
    .catch(error => console.warn('Norvim app setup unavailable:', error)));
}
</script>
</body>

</html>
