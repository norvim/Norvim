<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#123b66">
</head>
<body>

    <h1>Admin Login</h1>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label>Password</label>

<div class="password-container">

    <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
    >

    <button type="button" onclick="togglePassword()">
        👁️
    </button>

</div>

        <button type="submit" id="loginBtn">Login</button>

    </form>

    <script src="js/admin-login.js?v=20260901-4"></script>
    <script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope: '/'})
    .catch(error => console.warn('Norvim app setup unavailable:', error)));
}
</script>
</body>
</html>
