<!DOCTYPE html>
<html>
<head>
    <title>Manage Employers | Norvim Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <style>
      .employer-admin-wrap{max-width:1100px;margin:24px auto;padding:0 16px;color:var(--text-color,#172033)}
      .employer-admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
      .employer-admin-toolbar input{flex:1;min-width:220px;padding:12px;border:1px solid #cbd5e1;border-radius:10px}
      .employer-admin-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
      .employer-admin-group{min-width:0;border:1px solid #d7e0ed;border-radius:14px;padding:14px;background:#f8fafc}
      .employer-admin-group h3{margin:4px 0 12px;color:#172554}
      .employer-admin-card{background:#fff;color:#172033;border:1px solid #dbe3ee;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 3px 10px rgba(15,23,42,.06);overflow-wrap:anywhere}
      .employer-admin-card img{max-width:80px;max-height:80px;object-fit:contain;border-radius:10px}
      .employer-admin-card p{margin:7px 0;color:#334155}.employer-admin-badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:#e2e8f0;color:#334155;text-transform:capitalize}
      .employer-admin-badge.verified{background:#dcfce7;color:#166534}.employer-admin-badge.unverified{background:#fef3c7;color:#92400e}
      .employer-admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
      .employer-admin-actions button,.employer-admin-back{border:1px solid #cbd5e1;border-radius:9px;padding:9px 13px;cursor:pointer;background:#e8eef8;color:#172554;font-weight:700}
      .employer-admin-actions .danger{background:#fee2e2;color:#991b1b;border-color:#fecaca}.employer-admin-actions .primary{background:#1d4ed8;color:white;border-color:#1d4ed8}
      .employer-admin-empty{color:#64748b;font-size:14px}
      @media(max-width:720px){.employer-admin-groups{grid-template-columns:1fr}.employer-admin-group{padding:10px}}
    </style>
</head>

<body>

<main class="employer-admin-wrap">
  <h2>Employer Accounts</h2>
  <p>Verified and unverified employers are separated below. Existing activate/suspend controls remain available for verified accounts.</p>
  <div class="employer-admin-toolbar">
    <input type="search" id="searchEmployer" placeholder="Search company name, email or phone…" oninput="searchEmployers()">
    <button class="employer-admin-back" onclick="window.location.href='admin.html'">Back to Admin</button>
  </div>
  <p id="employerAdminMessage" role="status" aria-live="polite"></p>
  <div class="employer-admin-groups">
    <section class="employer-admin-group"><h3>Unverified Employers <span id="unverifiedEmployerCount">0</span></h3><div id="unverifiedEmployers"></div></section>
    <section class="employer-admin-group"><h3>Verified Employers <span id="verifiedEmployerCount">0</span></h3><div id="verifiedEmployers"></div></section>
  </div>
</main>

<script src="js/admin-employers.js?v=tot-1"></script>
<script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>
</body>
</html>
