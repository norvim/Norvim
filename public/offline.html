<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b66"><title>Norvim — Offline</title><style>body{font-family:Arial,sans-serif;max-width:560px;margin:15vh auto;padding:24px;text-align:center;color:#17324d}img{width:96px;height:96px}a{display:inline-block;margin-top:18px;padding:12px 20px;background:#123b66;color:white;border-radius:8px;text-decoration:none}</style>        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#123b66">
</head><body><img src="/images/norvim-icon-192.png" alt="Norvim"><h1>You’re offline</h1><p>Norvim needs an internet connection to load jobs, accounts and marketplace updates. Please reconnect and try again.</p><a href="/">Try again</a>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope: '/'})
    .catch(error => console.warn('Norvim app setup unavailable:', error)));
}
</script>
</body></html>
