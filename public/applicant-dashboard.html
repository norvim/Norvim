<!DOCTYPE html>
<html>
<head>
    <title>Applicant Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top-bar">

    <h2>Engineering Jobs</h2>

    <div class="top-actions">

        <button id="homeBtn" class="home-btn" onclick="window.location.href='index.html'">
            <span class="home-icon">🏠</span>
            <span>Home</span>
        </button>

        <button id="profileBtn">
            Profile
        </button>

        <button id="savedJobsBtn">
            Saved Jobs
        </button>

        <button onclick="window.location.href='advertise.html'">📣 Advertise</button>

        <button id="accountBtn" onclick="window.location.href='account.html'">
            Account & Wallet
        </button>

        <button id="logout">
            Logout
        </button>

    </div>

</header>
<img id="dashboardPhoto"
     src=""
     width="100"
     height="100"
     style="border-radius:50%; object-fit:cover;"><br><br>


<div class="dashboard-container">

    <div class="welcome-card">

        <h3 id="welcome"></h3>

        <p>
            Manage your applications, saved jobs, profile and notifications.
        </p>

    </div>

    <div class="dashboard-card">

        <div class="card-header">

            <h3>
                🔔 Notifications
                <span id="notificationCount">0</span>
            </h3>

            <button onclick="markAllAsRead()">
                Mark all as read
            </button>

        </div>

        <div id="notificationBox"></div>

    </div>

    <div class="dashboard-card">

        <h3>My Applications</h3>

        <div id="applications"></div>

    </div>

    <div class="dashboard-card">
        <h3>My Marketplace Bookings</h3>
        <div id="marketplaceBookings"></div>
    </div>

    <div class="dashboard-card">
        <h3>My Labour Requests</h3>
        <div id="myLabourRequests"></div>
    </div>

</div>
<a href="feedback.html" class="btn">
    give Feedback
</a>

<button id="deleteAccount">
    Delete Account
</button>

<div id="marketActionModal" class="market-modal" hidden>
  <div class="market-modal-box">
    <button class="market-modal-close" type="button" onclick="closeMarketplaceAction()">×</button>
    <h3 id="marketActionTitle">Action</h3>
    <p id="marketActionHint"></p>
    <textarea id="marketActionText" maxlength="1500" placeholder="Enter your reason..."></textarea>
    <div><button type="button" onclick="closeMarketplaceAction()">Cancel</button> <button type="button" id="marketActionSubmit">Submit</button></div>
  </div>
</div>


<script src="js/applicant-dashboard.js?v=20260916-empire"></script>
<script src="js/notifications.js?v=20260901-4"></script>
<script src="js/dark-mode.js?v=20260901-4"></script>

<script src="js/photo-viewer.js?v=20260914-taper"></script>
<script src="js/location-sync.js?v=20260914-taper"></script>
</body>
</html>
