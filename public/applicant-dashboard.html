<!DOCTYPE html>
<html>
<head>
    <title>Applicant Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="top-bar">

    <h2>Engineering Jobs</h2>

    <div class="top-actions">

        <button id="profileBtn">
            Profile
        </button>

        <button id="savedJobsBtn">
            Saved Jobs
        </button>

        <button id="logout">
            Logout
        </button>

    </div>

</header>
<img id="dashboardPhoto"
     src=""
     width="100"
     height="100"
     style="border-radius:50%; object-fit:cover;"><br><br>


<div class="dashboard-container">

    <div class="welcome-card">

        <h3 id="welcome"></h3>

        <p>
            Manage your applications, saved jobs, profile and notifications.
        </p>

    </div>

    <div class="dashboard-card">

        <div class="card-header">

            <h3>
                🔔 Notifications
                <span id="notificationCount">0</span>
            </h3>

            <button onclick="markAllAsRead()">
                Mark all as read
            </button>

        </div>

        <div id="notificationBox"></div>

    </div>

    <div class="dashboard-card">

        <h3>My Applications</h3>

        <div id="applications"></div>

    </div>

</div>
<a href="feedback.html" class="btn">
    give Feedback
</a>

<button id="deleteAccount">
    Delete Account
</button>


<script src="js/applicant-dashboard.js"></script>
<script src="js/notifications.js"></script>

</body>
</html>
